[package]
name = "anvil-formats"
description = "Readers for Ubisoft Anvil engine data: .forge archives and the meshes, textures, materials, entities and terrain inside (Riders Republic, Shaun White Skateboarding)"
keywords = ["anvil", "forge", "game-formats", "riders-republic", "modding"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/anvil-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
dxcontainer.workspace = true
thiserror.workspace = true

[dev-dependencies]
primase-testdata.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/anvil-formats"
publish = true

[workspace.dependencies]
dxcontainer = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "c32a3689c6bd26a0ee0777664091f4e04843927e" }
primase-foundations = { version = "0.3.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e" }
primase-testdata = { version = "0.1.3", git = "https://github.com/Kalmarv/primase-testdata", rev = "fcb06c6dd160a2fc4ee6720c5eb95880bbad6410" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
