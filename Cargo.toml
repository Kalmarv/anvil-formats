[package]
name = "anvil-formats"
description = "Readers for Ubisoft Anvil engine data: .forge archives and the meshes, textures, materials, entities and terrain inside (Riders Republic, Shaun White Skateboarding)"
keywords = ["anvil", "forge", "game-formats", "riders-republic", "modding"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/anvil-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
dxcontainer.workspace = true
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true
primase-testdata.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/anvil-formats"
publish = true

[workspace.dependencies]
dxcontainer = "0.12.0"
primase-foundations = "0.3.1"
sha2 = "0.10"
primase-testdata = "0.1.8"
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
